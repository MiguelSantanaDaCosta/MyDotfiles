# =============================================================================
# 🧠 PREFIXO (atalho principal do tmux)
# =============================================================================
unbind C-b                     # remove padrão
set -g prefix C-a              # define novo prefixo
bind C-a send-prefix           # permite enviar C-a para apps


# =============================================================================
# 🔄 RELOAD CONFIG
# =============================================================================
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"


# =============================================================================
# 📁 JANELAS E PANES (sempre no diretório atual)
# =============================================================================
bind n new-window -c "#{pane_current_path}"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %


# =============================================================================
# 🧭 NAVEGAÇÃO ENTRE PANES (Vim style)
# =============================================================================
set -g mode-keys vi
set -g status-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# =============================================================================
# ✂️ COPY MODE (estilo Vim)
# =============================================================================
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"


# =============================================================================
# 🖱️ MOUSE (ativado por padrão + toggle)
# =============================================================================
set -g mouse on

# Toggle mouse ON/OFF (Vim vs Mouse mode)
bind m if -F '#{mouse}' \
  'set -g mouse off \; display "󰍽 Mouse OFF (Vim Mode)"' \
  'set -g mouse on  \; display "󰍽 Mouse ON (Normal Mode)"'


# =============================================================================
# 🧪 SCROLL INTELIGENTE (mouse entra em copy-mode automático)
# =============================================================================
bind -T root WheelUpPane if-shell -F '#{pane_in_mode}' \
  'send-keys -M' \
  'copy-mode -e \; send-keys -M'


# =============================================================================
# ⚙️ CONFIGURAÇÕES GERAIS
# =============================================================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"

set -g escape-time 0
set -g status-position top


# =============================================================================
# 🎨 STATUS BAR (Catppuccin)
# =============================================================================
set -g window-status-separator "|"

set -g status-left-length 0
set -g status-left " #{?client_prefix,#[fg=#{@thm_red} bold],#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold],#[fg=#{@thm_green} bold]}}TMUX #[fg=#{@thm_fg} bold]| "

set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_number "#[bold]#I: #W  "
set -g @catppuccin_window_current_text ""

set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_number "#[fg=#{@thm_fg} bold]#I: #W  "
set -g @catppuccin_window_text ""

# Status direita com indicador de mouse
set -g status-right "#[fg=#{@thm_peach} bold] [#S] #[fg=#{@thm_fg} bold]| #[fg=#{@thm_red}]#{?mouse,󰍽 ON,󰍽 OFF} "
set -ga status-right "#[fg=#{@thm_blue} bold]󰃰 %a %d/%m/%Y ~ %H:%M "


# =============================================================================
# 🔌 PLUGINS (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'viegphunt/catppuccin-tmux'
set -g @catppuccin_flavor 'mocha'


# =============================================================================
# 🚀 INICIALIZAÇÃO (sempre no final)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
